name: Continuous Integration (CI)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-frontend:
    name: Build & Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend2/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend2
        run: npm ci

      - name: Lint Frontend
        working-directory: ./frontend2
        run: npm run lint

      - name: Build Frontend
        working-directory: ./frontend2
        run: npm run build

  test-backend:
    name: Check & Validate Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend2/package-lock.json'

      - name: Install dependencies
        working-directory: ./backend2
        run: npm ci

      - name: Syntax & Test Check
        working-directory: ./backend2
        run: npm test
